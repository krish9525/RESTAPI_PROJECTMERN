services:

  # ── Express Backend ───────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: blogapp_server
    restart: unless-stopped
    ports:
      - "5001:5000"
    env_file:
      - ./server/.env
    environment:
      - PORT=5000
    networks:
      - blogapp_net

  # ── React Frontend (Nginx) ────────────────────────────────────
  client:
    build:
      context: ./CRUD
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5001
    container_name: blogapp_client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - blogapp_net

networks:
  blogapp_net:
    driver: bridge
